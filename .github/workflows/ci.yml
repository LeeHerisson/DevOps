name: Lab 2 CI

on:
  push:
    branches: [main, 'feature/lab2-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Install configuration validators
        run: python -m pip install 'ansible-core>=2.17,<2.18' 'PyYAML>=6,<7'
      - name: Check YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('devops-lab2/infrastructure').rglob('*.y*ml'))
          paths += sorted(Path('.github/workflows').glob('*.yml'))
          for path in paths:
              with path.open() as stream:
                  documents = list(yaml.safe_load_all(stream))
              assert documents and all(isinstance(doc, dict) or isinstance(doc, list) for doc in documents), path
              print(f'YAML OK: {path}')
          PY
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive devops-lab2/infrastructure/terraform
      - name: Initialize Terraform
        working-directory: devops-lab2/infrastructure/terraform
        run: terraform init -backend=false -input=false
      - name: Validate and plan Terraform
        working-directory: devops-lab2/infrastructure/terraform
        run: |
          terraform validate
          terraform plan -input=false -lock=false
      - name: Check and run Ansible
        run: |
          ansible-playbook -i devops-lab2/infrastructure/ansible/inventory.ini devops-lab2/infrastructure/ansible/playbook.yml --syntax-check
          ansible-playbook -i devops-lab2/infrastructure/ansible/inventory.ini devops-lab2/infrastructure/ansible/playbook.yml
      - name: Build and run Docker image
        run: |
          docker build -t devops-lab2:ci devops-lab2/infrastructure/docker
          output=$(docker run --rm devops-lab2:ci)
          printf '%s\n' "$output"
          test "$output" = 'DevOps Lab 2: Docker image works'
      - name: Check Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$GITHUB_WORKSPACE/devops-lab2/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
